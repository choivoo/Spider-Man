name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E (Chromium + SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/app.spec.ts
        env: { CI: 'true' }
      - name: Transformation QA (25 cycles)
        run: npx playwright test tests/e2e/qa.spec.ts
        env: { CI: 'true', QA_CYCLES: '25' }
# Deployment: connect the repo to Vercel — every push to main deploys automatically (see docs/DEPLOY.md).
